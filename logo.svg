<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Oak Pink Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A9D" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>

    <!-- Inner Soft Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.20" />
    </filter>
  </defs>

  <!-- Pink Circle Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />

  <!-- Minimalist Oak Chevron / Cyber-Leaf Motif -->
  <g filter="url(#softShadow)" fill-rule="evenodd">
    <!-- Main Left Aerodynamic Leaf Petal -->
    <path fill="#FFFFFF" d="M375 138 C310 185 195 242 135 258 C116 263 118 284 138 288 C176 295 220 292 254 278 C276 269 300 252 324 230 L375 138 Z" />

    <!-- Lower Right Supporting Wing / Lobe -->
    <path fill="#EEF4FA" d="M375 138 L324 230 C300 252 276 269 254 278 C265 298 285 328 322 358 C338 371 356 362 360 342 C368 300 376 210 375 138 Z" />

    <!-- Center Negative Space Notch / Core Cut -->
    <path fill="url(#bgGrad)" d="M254 278 C276 269 300 252 324 230 C310 248 290 266 270 274 Z" opacity="0.6" />
  </g>
</svg>
